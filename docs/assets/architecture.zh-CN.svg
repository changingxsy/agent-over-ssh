<svg xmlns="http://www.w3.org/2000/svg" width="960" height="432" viewBox="0 0 960 432" role="img" aria-label="本地编辑 · 远程运行 · Git 与凭据始终不离开本机">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2328; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.h { font-size: 18px; font-weight: 600; }
.sub { font-size: 13px; fill: #59636e; }
.ct { font-size: 14px; font-weight: 600; }
.cs { font-size: 12px; fill: #59636e; }
.lane { font-size: 14px; font-weight: 600; }
.note { font-size: 12px; fill: #59636e; }
</style>
<defs>
<marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8250df"/></marker>
</defs>
<rect x="16" y="40" width="300" height="352" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="h" x="36" y="74">本机</text>
<text class="sub" x="36" y="95">Agent 与凭据都留在这里</text>
<rect x="32" y="114" width="268" height="54" rx="9" fill="#ffffff" stroke="#d0d7de"/>
<text class="ct" x="46" y="137">AI Agent</text>
<text class="cs" x="46" y="156">Claude Code · Codex</text>
<rect x="32" y="180" width="268" height="54" rx="9" fill="#ffffff" stroke="#d0d7de"/>
<text class="ct" x="46" y="203">凭据</text>
<text class="cs" x="46" y="222">API key · Git token · MCP</text>
<rect x="32" y="246" width="268" height="54" rx="9" fill="#ffffff" stroke="#d0d7de"/>
<text class="ct" x="46" y="269">Git 仓库  ~/work/myproj</text>
<text class="cs" x="46" y="288">只有轻量代码</text>
<rect x="32" y="312" width="268" height="54" rx="9" fill="#ffffff" stroke="#d0d7de"/>
<text class="ct" x="46" y="335">rdev + hooks</text>
<text class="cs" x="46" y="354">命令入口 · Agent 约束</text>
<rect x="644" y="40" width="300" height="352" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="h" x="664" y="74">服务器</text>
<text class="sub" x="664" y="95">只负责运行代码 · 容器也可以</text>
<rect x="660" y="114" width="268" height="54" rx="9" fill="#ffffff" stroke="#d0d7de"/>
<text class="ct" x="674" y="137">服务器环境</text>
<text class="cs" x="674" y="156">工具链 · GPU · 集群</text>
<rect x="660" y="180" width="268" height="54" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="5 4"/>
<text class="ct" x="674" y="203">只留在服务器的文件</text>
<text class="cs" x="674" y="222">数据集 · 模型权重 · 实验产物</text>
<rect x="660" y="246" width="268" height="54" rx="9" fill="#ffffff" stroke="#d0d7de"/>
<text class="ct" x="674" y="269">/srv/myproj</text>
<text class="cs" x="674" y="288">同步的代码 · 无 .git · 无凭据</text>
<rect x="660" y="312" width="268" height="54" rx="9" fill="#fbefff" stroke="#8250df"/>
<text class="ct" x="674" y="335">herdr pane  rdev-myproj</text>
<text class="cs" x="674" y="354">断网不中断 · 可实时查看</text>
<rect x="336" y="188" width="288" height="204" rx="16" fill="#ffffff" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="420" y="112" width="120" height="30" rx="15" fill="#f6f8fa" stroke="#9198a1"/>
<text class="ct mono" x="480" y="132" text-anchor="middle">SSH</text>
<text class="note" x="480" y="166" text-anchor="middle">一条 SSH 连接 · 不开额外端口</text>
<line x1="480" y1="142" x2="480" y2="152" stroke="#9198a1" stroke-width="1.5"/>
<line x1="480" y1="174" x2="480" y2="188" stroke="#9198a1" stroke-width="1.5"/>
<rect x="352" y="198" width="256" height="90" rx="10" fill="#ddf4ff" fill-opacity="0.55"/>
<text class="lane" x="480" y="219" text-anchor="middle" style="fill:#0969da">① 文件分流 · mutagen</text>
<text class="note" x="480" y="239" text-anchor="middle">代码双向同步</text>
<text class="note" x="480" y="256" text-anchor="middle">重型数据不出服务器</text>
<line x1="322" y1="273" x2="638" y2="273" stroke="#0969da" stroke-width="2.5" marker-start="url(#af)" marker-end="url(#af)"/>
<rect x="352" y="296" width="256" height="88" rx="10" fill="#fbefff" fill-opacity="0.55"/>
<text class="lane" x="480" y="315" text-anchor="middle" style="fill:#8250df">② 命令分流 · herdr</text>
<text class="note mono" x="480" y="331" text-anchor="middle">rdev 'pytest'</text>
<line x1="322" y1="339" x2="638" y2="339" stroke="#8250df" stroke-width="2.5" marker-end="url(#ac)"/>
<line x1="638" y1="356" x2="322" y2="356" stroke="#8250df" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ac)"/>
<text class="note" x="480" y="375" text-anchor="middle">输出 + 退出码</text>
<text class="sub" x="480" y="418" text-anchor="middle">本地编辑 · 远程运行 · Git 与凭据始终不离开本机</text>
</svg>
